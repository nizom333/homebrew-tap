name: update

# Запуск вручную после релиза jira-cli: gh workflow run update -R nizom333/homebrew-tap -f version=0.1.0
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Версия релиза jira-cli, например 0.1.0"
        required: true

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          VERSION: ${{ inputs.version }}
        run: |
          ./update.sh "$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "jira-cli ${VERSION#v}"
          git push
