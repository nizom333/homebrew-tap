name: test

# Проверяет, что установка через Homebrew и Scoop действительно работает.
on:
  push:
    branches: [main]
    paths: ["Formula/**", "Casks/**", "bucket/**", ".github/workflows/test.yml"]
  workflow_run:
    workflows: [update]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  brew:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: Homebrew/actions/setup-homebrew@main
      - run: |
          brew tap nizom333/tap
          brew install nizom333/tap/jira-cli
          brew test nizom333/tap/jira-cli
          jira version
          brew install nizom333/tap/bdv
          bdv --version
  scoop:
    runs-on: windows-latest
    steps:
      - shell: pwsh
        run: |
          Invoke-RestMethod -Uri https://get.scoop.sh -OutFile install.ps1
          ./install.ps1 -RunAsAdmin
          $env:PATH = "$env:USERPROFILE\scoop\shims;$env:PATH"
          scoop bucket add nizom333 https://github.com/nizom333/homebrew-tap
          scoop install jira-cli
          jira version
          scoop install bdv
          bdv --version
